<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="580">
  <defs>
    <linearGradient id="smartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080714"/>
      <stop offset="50%" stop-color="#120e26"/>
      <stop offset="100%" stop-color="#070611"/>
    </linearGradient>

    <pattern id="smartGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#2e1065" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>

    <filter id="smartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f472b6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="url(#smartBg)"/>
  <rect width="1000" height="580" fill="url(#smartGrid)"/>

  <!-- Header -->
  <g transform="translate(40, 35)">
    <text font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="2">&gt; MULTIMODAL_RAG :: CRYPTO_VERIFICATION</text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">SmartAI — Academic Authenticity &amp; Scholarship Intelligence</text>
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Smart India Hackathon (SIH 25029) | Computer Vision OCR + SHA-256 Ledger + Vector RAG</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(740, 35)">
    <rect width="220" height="32" rx="16" fill="#1e1035" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#c084fc" filter="url(#smartGlow)"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#e9d5ff">1,200+ SCHOLARSHIPS</text>
  </g>

  <!-- 1. OCR Ingestion & Hashing -->
  <g transform="translate(40, 110)">
    <rect width="250" height="420" rx="12" fill="#150d2a" stroke="#7e22ce" stroke-width="1.5"/>
    <rect width="250" height="32" rx="12" fill="#581c87"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f3e8ff">1. DOCUMENT PARSING &amp; OCR</text>

    <rect x="16" y="48" width="218" height="95" rx="8" fill="#090514" stroke="#3b0764" stroke-width="1"/>
    <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff">Multimodal Ingestion</text>
    <text x="24" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• Mark sheets, Income, Caste certs</text>
    <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• PDF &amp; high-res image pipeline</text>
    <text x="24" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• OpenCV image de-skewing</text>

    <rect x="16" y="155" width="218" height="95" rx="8" fill="#090514" stroke="#3b0764" stroke-width="1"/>
    <text x="24" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff">Deep OCR Extraction</text>
    <text x="24" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• Tesseract &amp; EasyOCR models</text>
    <text x="24" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• Name, Roll No, CGPA, Income</text>
    <text x="24" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• Layout-aware table extraction</text>

    <rect x="16" y="262" width="218" height="135" rx="8" fill="#090514" stroke="#a855f7" stroke-width="1"/>
    <text x="24" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff">Cryptographic Fingerprint</text>
    <text x="24" y="304" font-family="'Fira Code', monospace" font-size="10.5" fill="#a855f7">SHA-256 Payload Hash</text>
    <text x="24" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• Verifies document tamper-free</text>
    <text x="24" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• Anti-forgery seal check</text>
    <text x="24" y="362" font-family="'Fira Code', monospace" font-size="10.5" fill="#34d399">✓ 100% Cryptographic Match</text>
  </g>

  <!-- 2. Hybrid RAG & Vector Engine -->
  <g transform="translate(350, 110)">
    <rect width="310" height="420" rx="12" fill="#1b0e2b" stroke="#c084fc" stroke-width="2"/>
    <rect width="310" height="32" rx="12" fill="#701a75"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fdf4ff">2. HYBRID VECTOR RAG ENGINE</text>

    <rect x="16" y="48" width="278" height="100" rx="8" fill="#0b0416" stroke="#a21caf" stroke-width="1"/>
    <text x="26" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f0abfc">Scholarship Knowledge Corpus</text>
    <text x="26" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f5d0fe">• 1,200+ Central, State &amp; Private Schemes</text>
    <text x="26" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f5d0fe">• Recursive Character Text Chunking</text>
    <text x="26" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f5d0fe">• Metadata: Deadlines, Eligibility, Quotas</text>

    <rect x="16" y="160" width="278" height="110" rx="8" fill="#0b0416" stroke="#a21caf" stroke-width="1"/>
    <text x="26" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f0abfc">Dense + Sparse Hybrid Search</text>
    <text x="26" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f5d0fe">• MongoDB Atlas Vector Index</text>
    <text x="26" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f5d0fe">• BGE-Small / MiniLM Embeddings (384-d)</text>
    <text x="26" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f5d0fe">• BM25 Keyword Filter (Category &amp; Caste)</text>
    <text x="26" y="256" font-family="'Fira Code', monospace" font-size="10.5" fill="#38bdf8">Reciprocal Rank Fusion (RRF)</text>

    <rect x="16" y="282" width="278" height="115" rx="8" fill="#0b0416" stroke="#a21caf" stroke-width="1"/>
    <text x="26" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f0abfc">Cross-Encoder Re-Ranking</text>
    <text x="26" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f5d0fe">• Scores top 20 candidate matches</text>
    <text x="26" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f5d0fe">• Calculates Student Match Confidence %</text>
    <text x="26" y="360" font-family="'Fira Code', monospace" font-size="10.5" fill="#34d399">Top-1 Accuracy: 96.4%</text>
  </g>

  <!-- 3. Assistant & Verification Output -->
  <g transform="translate(710, 110)">
    <rect width="250" height="420" rx="12" fill="#1b0818" stroke="#db2777" stroke-width="1.5"/>
    <rect width="250" height="32" rx="12" fill="#831843"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fce7f3">3. DECISION &amp; COPILOT</text>

    <rect x="16" y="48" width="218" height="95" rx="8" fill="#0d020b" stroke="#500724" stroke-width="1"/>
    <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f472b6">Eligibility Match Matrix</text>
    <text x="24" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• Merit Cutoff: Met (8.83 &gt; 7.50)</text>
    <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• Income Ceiling: Verified (&lt; ₹2.5L)</text>
    <text x="24" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• State Domicile: Andhra Pradesh</text>

    <rect x="16" y="155" width="218" height="110" rx="8" fill="#0d020b" stroke="#500724" stroke-width="1"/>
    <text x="24" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f472b6">Conversational Copilot</text>
    <text x="24" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• Async Flask WebSocket API</text>
    <text x="24" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• Step-by-step application guidance</text>
    <text x="24" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• Missing document alerts</text>
    <text x="24" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• Multilingual Q&amp;A support</text>

    <rect x="16" y="278" width="218" height="120" rx="8" fill="#0d020b" stroke="#db2777" stroke-width="1"/>
    <text x="24" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f472b6">Verified Submission Dossier</text>
    <text x="24" y="322" font-family="'Fira Code', monospace" font-size="10.5" fill="#38bdf8">NSP / State Portal Export</text>
    <text x="24" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• Pre-filled schema payload</text>
    <text x="24" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fbcfe8">• SHA-256 Audit Trail</text>
    <text x="24" y="380" font-family="'Fira Code', monospace" font-size="10.5" fill="#34d399">Status: READY_FOR_DISPATCH</text>
  </g>

  <!-- Connectors -->
  <path d="M 290 320 L 350 320" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 660 320 L 710 320" fill="none" stroke="#f472b6" stroke-width="2" marker-end="url(#arrowPink)"/>
</svg>
